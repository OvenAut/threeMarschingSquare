<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OO75 3D HMI</title>
</head>
  <body style="border: 0px; margin: 0px; overflow: hidden;">
    <script>
      // Eigene Dateien bei jedem Laden mit frischer Versionsnummer holen,
      // damit der Browser-Cache nie eine alte Version von main.js / height.js / Worker liefert.
      const version = Date.now();
      const importMap = document.createElement('script');
      importMap.type = 'importmap';
      importMap.textContent = JSON.stringify({
        imports: {
          'three': './library/three.module.js',
          'three/tsl': './library/three.tsl.js',
          'three/addons/': './library/',
          'three/webgpu': './library/three.webgpu.nodes.js',
          'three/material': './material/',
          './terrain/height.js': `./terrain/height.js?v=${version}`
        }
      });
      document.currentScript.after(importMap);

      const main = document.createElement('script');
      main.type = 'module';
      main.src = `./main.js?v=${version}`;
      importMap.after(main);
    </script>
  </body>
</html>
